[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-triage"
version = "0.1.0"
description = "Read-only Apple Mail and Calendar CLI for Codex daily triage reports"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
apple-triage = "apple_triage.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apple_triage*"]
